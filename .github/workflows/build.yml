name: build

on:
  - push
  - pull_request

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      LIBASS_ANDROID_PROVIDER_AAR: ${{ github.workspace }}/dependencies/libass-android/OUTPUT/lib_ass-release.aar
      LIBDOVI_ANDROID_SDK: ${{ github.workspace }}/dependencies/libdovi-android/OUTPUT/sdk
      ORG_GRADLE_PROJECT_libassProviderRepository: ${{ github.workspace }}/dependencies/libass-android/OUTPUT/maven
      ORG_GRADLE_PROJECT_libassProviderProperties: ${{ github.workspace }}/dependencies/libass-android/OUTPUT/libass-provider.properties
    strategy:
      fail-fast: false
      matrix:
        architecture: [ armv7l, arm64, x86, x86_64 ]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Checkout shared libass provider
        uses: actions/checkout@v4
        with:
          repository: thor2002ro/libass-android
          ref: master
          path: dependencies/libass-android
      - name: Checkout Dolby Vision SDK
        uses: actions/checkout@v4
        with:
          repository: thor2002ro/libdovi-android
          ref: main
          path: dependencies/libdovi-android
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip gperf
          sudo pip3 install 'meson>=1.11'

      - name: Download deps
        run: buildscripts/include/ci.sh install

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch ${{ matrix.architecture }} mpv
          ./buildall.sh -n

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-lib-${{ matrix.architecture }}
          path: lib/build/outputs/aar/lib-release.aar
