name: build

on:
  - push
  - pull_request

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [ armv7l, arm64, x86, x86_64 ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config libtool ninja-build python3-pip gperf
          sudo pip3 install 'meson>=1.11'

      - name: Download deps
        run: buildscripts/include/ci.sh install

      - name: Build the release artifacts
        run: |
          set -x
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          ./buildall.sh --arch ${{ matrix.architecture }} mpv
          ./buildall.sh -n

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-lib-${{ matrix.architecture }}
          path: lib/build/outputs/aar/app-release.aar
